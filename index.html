<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深海恋温测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #0a0e27;
    color: #e0e8ff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  #particles-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }

  .container {
    position: relative; z-index: 1;
    max-width: 460px; margin: 0 auto;
    padding: 20px 16px 40px; min-height: 100vh;
  }

  /* 顶部导航 */
  .top-nav {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0 12px;
  }
  .home-btn {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; color: #4a5a82;
    font-size: 13px; cursor: pointer; padding: 6px 10px;
    border-radius: 8px; transition: all 0.3s;
  }
  .home-btn:hover { color: #4fc3f7; background: rgba(79,195,247,0.08); }
  .home-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .auto-save-tag { font-size: 12px; color: #4a5a82; }

  /* 开始页 */
  .start-page {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 90vh; text-align: center;
    animation: fadeIn 1s ease;
  }
  .start-page .deep-icon {
    width: 100px; height: 100px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4fc3f7, #0288d1, #01579b);
    margin-bottom: 30px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(79,195,247,0.3), 0 0 80px rgba(2,136,209,0.15);
    animation: pulse 3s ease-in-out infinite;
  }
  .deep-icon svg { width: 50px; height: 50px; fill: #fff; opacity: 0.9; }
  .start-page h1 {
    font-size: 28px; font-weight: 700; margin-bottom: 12px;
    background: linear-gradient(135deg, #4fc3f7, #e0e8ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .start-page .subtitle {
    font-size: 14px; color: #7b8cb8; margin-bottom: 40px; line-height: 1.6;
  }
  .start-buttons {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    width: 100%; max-width: 260px;
  }
  .start-btn {
    padding: 14px 48px; border: none; border-radius: 30px;
    background: linear-gradient(135deg, #0288d1, #4fc3f7);
    color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
    transition: all 0.3s; box-shadow: 0 4px 20px rgba(2,136,209,0.4);
    letter-spacing: 1px; width: 100%;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(2,136,209,0.5); }
  .continue-btn {
    padding: 14px 48px; border: 2px solid rgba(79,195,247,0.4); border-radius: 30px;
    background: rgba(79,195,247,0.08); color: #4fc3f7; font-size: 17px;
    font-weight: 600; cursor: pointer; transition: all 0.3s; width: 100%; letter-spacing: 1px;
  }
  .continue-btn:hover { background: rgba(79,195,247,0.15); border-color: rgba(79,195,247,0.6); }
  .continue-hint { font-size: 12px; color: #4a5a82; margin-top: -4px; }
  .start-note { margin-top: 20px; font-size: 12px; color: #4a5a82; }

  /* 历史记录 */
  .history-section { width: 100%; max-width: 340px; margin-top: 32px; }
  .history-title { font-size: 13px; color: #4a5a82; margin-bottom: 12px; letter-spacing: 1px; text-align: center; }
  .history-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.3s;
  }
  .history-card:hover { background: rgba(79,195,247,0.06); border-color: rgba(79,195,247,0.15); }
  .history-left { display: flex; flex-direction: column; gap: 4px; }
  .history-level { font-size: 15px; font-weight: 600; color: #e0e8ff; }
  .history-date { font-size: 12px; color: #4a5a82; }
  .history-temp { font-size: 22px; font-weight: 700; color: #4fc3f7; }
  .history-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  .history-clear-btn {
    background: none; border: 1px solid rgba(255,255,255,0.08); color: #4a5a82;
    font-size: 12px; padding: 4px 14px; border-radius: 12px; cursor: pointer; transition: all 0.3s;
  }
  .history-clear-btn:hover { color: #ef5350; border-color: rgba(239,83,80,0.3); }

  /* 答题页 */
  .quiz-page { display: none; animation: fadeIn 0.5s ease; }
  .quiz-page.active { display: block; }
  .progress-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #01579b, #4fc3f7); border-radius: 2px; transition: width 0.5s ease; }
  .progress-text { text-align: center; font-size: 12px; color: #4a5a82; margin-bottom: 24px; }
  .depth-indicator { text-align: center; margin-bottom: 20px; font-size: 12px; color: #4fc3f7; letter-spacing: 2px; opacity: 0.7; }
  .question-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 28px 20px; margin-bottom: 16px; backdrop-filter: blur(10px);
  }
  .question-text { font-size: 17px; line-height: 1.7; font-weight: 500; margin-bottom: 24px; color: #e0e8ff; }
  .question-dim {
    display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 10px;
    margin-bottom: 14px; background: rgba(79,195,247,0.12); color: #4fc3f7;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    width: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; background: rgba(255,255,255,0.03); color: #c0c8e8;
    font-size: 15px; line-height: 1.5; text-align: left; cursor: pointer;
    transition: all 0.3s; display: flex; align-items: flex-start; gap: 10px;
  }
  .option-btn:hover { background: rgba(79,195,247,0.08); border-color: rgba(79,195,247,0.2); color: #e0e8ff; }
  .option-btn.selected { background: rgba(79,195,247,0.12); border-color: rgba(79,195,247,0.4); color: #fff; box-shadow: 0 0 20px rgba(79,195,247,0.1); }
  .option-label {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.2); display: flex; align-items: center;
    justify-content: center; font-size: 12px; margin-top: 1px; transition: all 0.3s;
  }
  .option-btn.selected .option-label { background: #4fc3f7; border-color: #4fc3f7; color: #0a0e27; font-weight: 700; }
  .nav-area { display: flex; justify-content: space-between; align-items: center; margin-top: 24px; gap: 12px; }
  .nav-btn {
    padding: 12px 28px; border: 1px solid rgba(79,195,247,0.3); border-radius: 25px;
    background: transparent; color: #4fc3f7; font-size: 15px; cursor: pointer; transition: all 0.3s;
  }
  .nav-btn:hover { background: rgba(79,195,247,0.1); }
  .nav-btn.primary { background: linear-gradient(135deg, #0288d1, #4fc3f7); border: none; color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(2,136,209,0.3); }
  .nav-btn.primary:hover { box-shadow: 0 6px 24px rgba(2,136,209,0.4); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* 结果页 */
  .result-page { display: none; animation: fadeIn 1s ease; text-align: center; padding-top: 20px; }
  .result-page.active { display: block; }
  .thermometer-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
  .temp-display {
    font-size: 64px; font-weight: 800;
    background: linear-gradient(135deg, #4fc3f7, #e0e8ff, #ff8a80);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 4px; line-height: 1; letter-spacing: -2px;
  }
  .temp-unit { font-size: 20px; color: #7b8cb8; margin-bottom: 16px; }
  .thermometer-bar { width: 200px; height: 8px; background: rgba(255,255,255,0.08); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .thermometer-fill { height: 100%; border-radius: 4px; transition: width 2s ease; width: 0%; }
  .thermo-labels { display: flex; justify-content: space-between; width: 200px; font-size: 10px; color: #4a5a82; }
  .level-badge { display: inline-block; padding: 8px 24px; border-radius: 20px; font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; }
  .level-subtitle { font-size: 13px; color: #7b8cb8; margin-bottom: 28px; }
  .dimension-section { margin-bottom: 28px; text-align: left; }
  .dimension-section h3 { font-size: 15px; color: #7b8cb8; margin-bottom: 16px; text-align: center; letter-spacing: 1px; }
  .dim-item { display: flex; align-items: center; margin-bottom: 12px; gap: 12px; }
  .dim-label { width: 70px; font-size: 13px; color: #7b8cb8; text-align: right; flex-shrink: 0; }
  .dim-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .dim-bar-fill { height: 100%; border-radius: 3px; transition: width 1.5s ease; }
  .dim-score { width: 36px; font-size: 13px; color: #4fc3f7; flex-shrink: 0; }
  .result-desc {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 22px 18px; margin-bottom: 24px;
    text-align: left; line-height: 1.8; font-size: 14px; color: #a0b0d0;
  }
  .result-desc strong { color: #e0e8ff; }
  .insight-title { font-size: 15px; font-weight: 600; color: #4fc3f7; margin-bottom: 10px; text-align: center; }
  .insight-box {
    background: rgba(79,195,247,0.05); border: 1px solid rgba(79,195,247,0.1);
    border-radius: 14px; padding: 22px 18px; margin-bottom: 24px;
    text-align: left; line-height: 1.8; font-size: 14px; color: #a0b0d0;
  }
  .result-btn-group { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 10px; margin-bottom: 30px; }
  .restart-btn {
    padding: 12px 36px; border: 1px solid rgba(79,195,247,0.3); border-radius: 25px;
    background: transparent; color: #4fc3f7; font-size: 15px; cursor: pointer; transition: all 0.3s;
  }
  .restart-btn:hover { background: rgba(79,195,247,0.1); }
  .share-hint { font-size: 12px; color: #4a5a82; margin-bottom: 20px; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 40px rgba(79,195,247,0.3), 0 0 80px rgba(2,136,209,0.15); } 50% { box-shadow: 0 0 50px rgba(79,195,247,0.4), 0 0 100px rgba(2,136,209,0.2); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .float-anim { animation: float 4s ease-in-out infinite; }

  @media (max-width: 380px) {
    .question-text { font-size: 15.5px; }
    .option-btn { font-size: 14px; padding: 12px 14px; }
    .temp-display { font-size: 54px; }
  }
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="container">

  <!-- 开始页 -->
  <div class="start-page" id="startPage">
    <div class="deep-icon float-anim">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
    </div>
    <h1>深海恋温测试</h1>
    <p class="subtitle">
      26道深海探测 · 测量你们之间的真实温度<br>
      <span style="font-size:12px; opacity:0.6">不是所有选项都如它看起来那样</span>
    </p>
    <div class="start-buttons">
      <button class="start-btn" onclick="startQuiz(true)">开始潜入深海</button>
      <button class="continue-btn" id="continueBtn" style="display:none" onclick="startQuiz(false)">继续上次测试</button>
      <p class="continue-hint" id="continueHint" style="display:none"></p>
    </div>
    <p class="start-note">约需 5-8 分钟 · 请凭真实感受作答</p>
    <div class="history-section" id="historySection" style="display:none">
      <div class="history-title">📋 历史测试记录</div>
      <div id="historyList"></div>
      <div class="history-actions">
        <button class="history-clear-btn" onclick="clearHistory()">清除全部记录</button>
      </div>
    </div>
  </div>

  <!-- 答题页 -->
  <div class="quiz-page" id="quizPage">
    <div class="top-nav">
      <button class="home-btn" onclick="goHome()">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        首页
      </button>
      <span class="auto-save-tag" id="autoSaveHint">自动保存中</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">1 / 26</div>
    <div class="depth-indicator" id="depthIndicator">▼ 海面层 · 0m</div>
    <div class="question-card">
      <div class="question-dim" id="questionDim"></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsArea"></div>
    </div>
    <div class="nav-area">
      <button class="nav-btn" id="prevBtn" onclick="prevQuestion()" disabled>上一题</button>
      <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </div>

  <!-- 结果页 -->
  <div class="result-page" id="resultPage">
    <div class="top-nav">
      <button class="home-btn" onclick="goHome()">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        首页
      </button>
    </div>
    <div class="thermometer-wrap">
      <div class="temp-display" id="tempDisplay">0</div>
      <div class="temp-unit">恋爱深海温度 °L</div>
      <div class="thermometer-bar"><div class="thermometer-fill" id="thermoFill"></div></div>
      <div class="thermo-labels"><span>0°</span><span>50°</span><span>100°</span></div>
    </div>
    <div class="level-badge" id="levelBadge"></div>
    <div class="level-subtitle" id="levelSubtitle"></div>
    <div class="dimension-section">
      <h3>四维深海图谱</h3>
      <div class="dim-item">
        <span class="dim-label">情感浓度</span>
        <div class="dim-bar"><div class="dim-bar-fill" id="dimI" style="background:linear-gradient(90deg,#4fc3f7,#81d4fa)"></div></div>
        <span class="dim-score" id="dimIScore"></span>
      </div>
      <div class="dim-item">
        <span class="dim-label">唯一认知</span>
        <div class="dim-bar"><div class="dim-bar-fill" id="dimS" style="background:linear-gradient(90deg,#ab47bc,#ce93d8)"></div></div>
        <span class="dim-score" id="dimSScore"></span>
      </div>
      <div class="dim-item">
        <span class="dim-label">亲密信任</span>
        <div class="dim-bar"><div class="dim-bar-fill" id="dimT" style="background:linear-gradient(90deg,#26a69a,#80cbc4)"></div></div>
        <span class="dim-score" id="dimTScore"></span>
      </div>
      <div class="dim-item">
        <span class="dim-label">关系承诺</span>
        <div class="dim-bar"><div class="dim-bar-fill" id="dimC" style="background:linear-gradient(90deg,#ef5350,#ef9a9a)"></div></div>
        <span class="dim-score" id="dimCScore"></span>
      </div>
    </div>
    <div class="result-desc" id="resultDesc"></div>
    <div class="insight-title">🔍 深海洞察</div>
    <div class="insight-box" id="insightBox"></div>
    <p class="share-hint">截图分享给TA，看看TA测出多少度 💙</p>
    <div class="result-btn-group">
      <button class="restart-btn" onclick="restart()">重新测试</button>
    </div>
  </div>

</div><script>
const questions = [
  {
    id:1, dim:'I', dimLabel:'情感浓度',
    text:'回忆上周——TA大概多少次自己"冒"进你脑海里？不是你刻意想，是自动出现的那种。',
    options:[
      {text:'偶尔两三次', score:{I:1}},
      {text:'每天都会，一闪而过', score:{I:2}},
      {text:'挺频繁的，有时会沉浸一会儿', score:{I:3}},
      {text:'几乎无时无刻，吃饭走路发呆都是TA', score:{I:2}}
    ]
  },
  {
    id:2, dim:'I', dimLabel:'情感浓度',
    text:'上一次经历开心的事，你第一时间的真实反应是什么？',
    options:[
      {text:'发了朋友圈或跟朋友分享', score:{I:1}},
      {text:'想到TA了，但没急着说', score:{I:2}},
      {text:'第一个告诉TA，而且TA的反应直接影响了我的开心程度', score:{I:2}},
      {text:'不一定第一个说，但那个瞬间有种"TA在旁边就好了"的念头', score:{I:4}}
    ]
  },
  {
    id:3, dim:'I', dimLabel:'情感浓度',
    text:'你有没有翻过TA的朋友圈/社交媒体历史记录？',
    options:[
      {text:'没有，不太感兴趣', score:{I:1}},
      {text:'大概翻过一些，随意了解', score:{I:2}},
      {text:'翻过，而且对某些内容（比如跟异性互动的）特别在意', score:{I:1}},
      {text:'翻过，不是在查什么，就是想看看还没认识TA时TA过着什么样的生活', score:{I:4}}
    ]
  },
  {
    id:4, dim:'I', dimLabel:'情感浓度',
    text:'跟TA在一起的时候，时间感会变吗？',
    options:[
      {text:'没什么特别感觉', score:{I:1}},
      {text:'有点快，但分开后也不会特别难受', score:{I:2}},
      {text:'在一起时觉得时间太快，分开后经常数着时间等下次见面', score:{I:2}},
      {text:'在一起时确实觉得快，但偶尔也有安静各干各的时候，也不觉得浪费', score:{I:4}}
    ]
  },
  {
    id:5, dim:'I', dimLabel:'情感浓度',
    text:'最近一次跟TA发生不愉快，你当时的第一个念头是什么？',
    options:[
      {text:'"算了，没什么大不了"——没有特别多情绪', score:{I:1}},
      {text:'"TA怎么能这样？"——生气，觉得TA不对', score:{I:2}},
      {text:'"是不是我哪里做得不好？"——先反思自己', score:{I:2}},
      {text:'"好难受，但我想搞清楚到底怎么了"——不舒服，但没急着下结论', score:{I:4}}
    ]
  },
  {
    id:6, dim:'I', dimLabel:'情感浓度',
    text:'如果TA突然需要你放弃一个你很在意的个人计划（比如一次旅行、一个重要的周末），你内心真实的反应是——',
    options:[
      {text:'会不情愿，大概率还是选自己的计划', score:{I:1}},
      {text:'看情况，如果TA确实需要我，可以调整', score:{I:3}},
      {text:'毫不犹豫就放弃了，TA比什么都重要', score:{I:2}},
      {text:'内心会有一点矛盾，但会先了解TA为什么需要，再一起想办法', score:{I:4}}
    ]
  },
  {
    id:7, dim:'S', dimLabel:'唯一认知',
    text:'你觉得TA身上有没有一种"只有TA是这样"的特质？',
    options:[
      {text:'好像没什么特别的，跟别人差不多', score:{S:1}},
      {text:'有一些优点，但说不上独一无二', score:{S:2}},
      {text:'有，TA是我见过最好/最特别的人，没有之一', score:{S:2}},
      {text:'有，但不是"最好"那种——是一种我很难跟别人描述的东西，可能是说话方式、某个习惯、笑起来的样子', score:{S:4}}
    ]
  },
  {
    id:8, dim:'S', dimLabel:'唯一认知',
    text:'如果一个各方面条件都比TA好的人追你，而且你们在一起还不算太久——你的真实想法是？',
    options:[
      {text:'会认真考虑，感情可以培养', score:{S:1}},
      {text:'会有点动摇，但大概率不会换', score:{S:2}},
      {text:'完全不会考虑，我的眼里只有TA', score:{S:3}},
      {text:'会承认对方确实优秀，但心里清楚那不是一回事——"好"和"对"是两件事', score:{S:4}}
    ]
  },
  {
    id:9, dim:'S', dimLabel:'唯一认知',
    text:'TA有没有什么缺点是你很清楚、但依然觉得"没关系"的？',

// ===================== 粒子背景 =====================
function initParticles() {
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random()*w; this.y = Math.random()*h;
      this.r = Math.random()*2+0.5; this.vx = (Math.random()-0.5)*0.3;
      this.vy = Math.random()*0.3+0.1; this.alpha = Math.random()*0.4+0.1;
      this.color = ['#4fc3f7','#81d4fa','#b3e5fc','#e0f7fa'][Math.floor(Math.random()*4)];
    }
    update() { this.x+=this.vx; this.y+=this.vy; if(this.y>h+10){this.reset();this.y=-10;} if(this.x<-10||this.x>w+10)this.reset(); }
    draw() { ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fillStyle=this.color; ctx.globalAlpha=this.alpha; ctx.fill(); ctx.globalAlpha=1; }
  }
  for(let i=0;i<60;i++) particles.push(new Particle());
  function animate() { ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animate); }
  animate();
}

// ===================== 进度存取 =====================
function saveProgress() {
  const data = { currentQ, answers, timestamp: Date.now() };
  try { localStorage.setItem(STORAGE_PROGRESS, JSON.stringify(data)); } catch(e){}
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_PROGRESS);
    if(raw) { const d = JSON.parse(raw); currentQ = d.currentQ||0; answers = d.answers||new Array(questions.length).fill(null); }
  } catch(e) { currentQ=0; answers.fill(null); }
}

function getProgressInfo() {
  try {
    const raw = localStorage.getItem(STORAGE_PROGRESS);
    if(!raw) return null;
    const d = JSON.parse(raw);
    const answered = d.answers.filter(a=>a!==null).length;
    if(answered===0) return null;
    return { answered, total:questions.length, timestamp:d.timestamp };
  } catch(e) { return null; }
}

// ===================== 历史存取 =====================
function saveResult(total, levelName, dims) {
  try {
    const h = getHistory();
    h.unshift({
      total, level:levelName, dims,
      date: new Date().toLocaleDateString('zh-CN'),
      time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
      timestamp: Date.now()
    });
    if(h.length>10) h.pop();
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(h));
  } catch(e){}
}

function getHistory() {
  try { const raw=localStorage.getItem(STORAGE_HISTORY); return raw?JSON.parse(raw):[]; } catch(e){return[];}
}

function clearHistory() {
  if(confirm('确定要清除全部历史记录吗？')) {
    localStorage.removeItem(STORAGE_HISTORY);
    refreshHome();
  }
}

// ===================== 首页刷新 =====================
function refreshHome() {
  // 继续按钮
  const prog = getProgressInfo();
  const cb = document.getElementById('continueBtn');
  const ch = document.getElementById('continueHint');
  if(prog) {
    cb.style.display='block'; ch.style.display='block';
    ch.textContent = '已完成 '+prog.answered+'/'+prog.total+' 题';
  } else {
    cb.style.display='none'; ch.style.display='none';
  }

  // 历史记录
  const history = getHistory();
  const sec = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if(history.length > 0) {
    sec.style.display='block';
    list.innerHTML='';
    history.forEach(h => {
      const card = document.createElement('div');
      card.className='history-card';
      card.innerHTML = '<div class="history-left"><span class="history-level">'+h.level+'</span><span class="history-date">'+h.date+' '+h.time+'</span></div><span class="history-temp">'+h.total+'°</span>';
      list.appendChild(card);
    });
  } else {
    sec.style.display='none';
  }
}

// ===================== 页面切换 =====================
function showPage(id) {
  ['startPage','quizPage','resultPage'].forEach(p => {
    const el = document.getElementById(p);
    if(p === 'startPage') el.style.display = (p===id?'flex':'none');
    else { if(p===id) el.classList.add('active'); else el.classList.remove('active'); }
  });
}

function goHome() {
  showPage('startPage');
  refreshHome();
  window.scrollTo({top:0,behavior:'smooth'});
}

function startQuiz(isNew) {
  if(isNew) { currentQ=0; answers.fill(null); localStorage.removeItem(STORAGE_PROGRESS); }
  else { loadProgress(); }
  showPage('quizPage');
  renderQuestion();
}

  const dl = depthLabels.find(d=>currentQ>=d.from&&currentQ<=d.to);
  document.getElementById('depthIndicator').textContent = '▼ '+(dl?dl.label:'');
  document.getElementById('questionDim').textContent = q.dimLabel;
  document.getElementById('questionText').textContent = q.text;

  q.options.forEach((opt,i) => {

    btn.className = 'option-btn'+(answers[currentQ]===i?' selected':'');
    btn.innerHTML = '<span class="option-label">'+labels[i]+'</span><span>'+opt.text+'</span>';
    btn.onclick = () => selectOption(i);
    area.appendChild(btn);
  });

  document.getElementById('prevBtn').disabled = (currentQ===0);
  const nb = document.getElementById('nextBtn');
  nb.textContent = (currentQ===questions.length-1)?'查看结果':'下一题';
  nb.disabled = (answers[currentQ]===null);
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option-btn').forEach((b,i)=>b.classList.toggle('selected',i===idx));
  document.getElementById('nextBtn').disabled = false;
  saveProgress();
}

function nextQuestion() {
  if(answers[currentQ]===null) return;
  if(currentQ<questions.length-1) { currentQ++; saveProgress(); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
  else { showResult(); }
}

function prevQuestion() {
  if(currentQ>0) { currentQ--; saveProgress(); renderQuestion(); window.scrollTo({top:0,behavior:'smooth'}); }
}

// ===================== 计算分数 =====================
function calcScores() {
  const dims={I:0,S:0,T:0,C:0}, maxDims={I:0,S:0,T:0,C:0};
  questions.forEach((q,qi)=>{
    const chosen=answers[qi]; if(chosen===null) return;
    const sc=q.options[chosen].score;
    const qMax={};
    q.options.forEach(opt=>{ for(let d in opt.score){ if(!qMax[d]||opt.score[d]>qMax[d]) qMax[d]=opt.score[d]; }});
    for(let d in sc){ dims[d]=(dims[d]||0)+sc[d]; maxDims[d]=(maxDims[d]||0)+(qMax[d]||0); }
  });
  const norm={}; let total=0;
  for(let d in dims){ norm[d]=maxDims[d]>0?Math.round((dims[d]/maxDims[d])*25):0; total+=norm[d]; }
  return {dims:norm,total};
}

// ===================== 显示结果 =====================
function showResult() {
  showPage('resultPage');
  const {dims,total} = calcScores();
  const level = levels.find(l=>total>=l.min&&total<=l.max)||levels[0];

  animateNumber(document.getElementById('tempDisplay'),0,total,1500);

  setTimeout(()=>{
    const fill=document.getElementById('thermoFill');
    fill.style.background=level.gradient; fill.style.width=total+'%';
  },200);

  const badge=document.getElementById('levelBadge');
  badge.textContent=level.name; badge.style.background=level.gradient;
  badge.style.color=total>60?'#fff':'#0a0e27';
  document.getElementById('levelSubtitle').textContent=level.depth+' — '+level.subtitle;

  const dimMap={I:'dimI',S:'dimS',T:'dimT',C:'dimC'};
  const scoreMap={I:'dimIScore',S:'dimSScore',T:'dimTScore',C:'dimCScore'};  setTimeout(()=>{
    for(let d in dimMap){
      document.getElementById(dimMap[d]).style.width=(dims[d]*4)+'%';
      document.getElementById(scoreMap[d]).textContent=dims[d];
    }
  },500);

  document.getElementById('resultDesc').innerHTML=level.desc;
  document.getElementById('insightBox').innerHTML=level.insight;

  // 保存结果到历史
  saveResult(total, level.name, dims);
  // 清除进度（已完成）
  localStorage.removeItem(STORAGE_PROGRESS);

  window.scrollTo({top:0,behavior:'smooth'});
}

// ===================== 数字动画 =====================
function animateNumber(el,from,to,duration) {
  const start=performance.now();
  function tick(now) {
    const p=Math.min((now-start)/duration,1);
    const eased=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(to-from)*eased);
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ===================== 重新测试 =====================
function restart() {
  currentQ=0; answers.fill(null);
  localStorage.removeItem(STORAGE_PROGRESS);
  showPage('quizPage');
  renderQuestion();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===================== 初始化 =====================
window.addEventListener('DOMContentLoaded', () => {
  initParticles();
  refreshHome();
});
</script>
