<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>单向深渊：个人情感烈度测算系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050507;
            --card-bg: rgba(15, 15, 18, 0.85);
            --primary: #c43c3c;
            --primary-hover: #e04a4a;
            --text-main: #d1d1d1;
            --text-muted: #666666;
            --glass-border: rgba(255, 255, 255, 0.06);
            --accent-glow: rgba(196, 60, 60, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 70%);
            font-family: 'Inter', 'Noto Serif SC', serif;
            color: var(--text-main);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        /* 顶部进度条 */
        .progress-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255,255,255,0.03); z-index: 100;
        }
        .progress-bar {
            height: 100%; background: var(--primary);
            width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--primary);
        }
        .progress-text {
            position: fixed; top: 15px; right: 20px;
            font-family: 'Inter', sans-serif; font-size: 0.8rem;
            color: var(--text-muted); letter-spacing: 2px;
            transition: color 0.3s;
        }

        /* 屏幕切换逻辑 */
        .screen {
            display: none; opacity: 0; transform: translateY(15px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .screen.active {
            display: block; opacity: 1; transform: translateY(0);
        }

        /* 欢迎屏 */
        .welcome-screen { text-align: center; }
        .title-main {
            font-size: 2.8rem; color: #fff; font-weight: 900;
            letter-spacing: 6px; margin-bottom: 20px;
            text-shadow: 0 0 30px var(--accent-glow);
        }
        .subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 60px; line-height: 1.9; }
        
        .btn {
            background: transparent; color: var(--primary);
            border: 1px solid var(--primary); padding: 16px 45px;
            font-family: 'Noto Serif SC', serif; font-size: 1.1rem;
            border-radius: 4px; cursor: pointer; transition: 0.4s;
            letter-spacing: 3px; position: relative; overflow: hidden;
        }
        .btn:hover {
            background: var(--primary); color: #fff;
            box-shadow: 0 0 25px var(--accent-glow);
        }

        /* 题目屏 */
        .q-card {
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 50px 40px; box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        
        /* 头部：包含题号和返回按钮 */
        .q-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        .q-num {
            font-size: 0.85rem; color: var(--primary); letter-spacing: 2px;
            font-family: 'Inter', sans-serif;
        }
        .back-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-family: 'Noto Serif SC', serif; font-size: 0.85rem;
            cursor: pointer; transition: color 0.3s; padding: 5px 10px;
            letter-spacing: 1px; display: none; /* 默认隐藏，第一题不显示 */
        }
        .back-btn:hover { color: var(--primary); }

        .q-text { font-size: 1.25rem; font-weight: 600; color: #fff; margin-bottom: 35px; line-height: 1.7; }
        
        .options { display: flex; flex-direction: column; gap: 14px; }
        .opt-btn {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            padding: 20px 24px; border-radius: 8px; cursor: pointer;
            text-align: left; color: #aaa; font-size: 0.95rem;
            transition: all 0.3s ease; line-height: 1.6; position: relative;
            opacity: 0; transform: translateY(10px);
        }
        .opt-btn:hover {
            background: rgba(196, 60, 60, 0.05); border-color: var(--primary);
            color: #fff; padding-left: 30px;
        }
        .opt-key {
            display: inline-block; background: rgba(255,255,255,0.1);
            color: var(--text-muted); font-family: 'Inter', sans-serif;
            font-size: 0.75rem; padding: 2px 6px; border-radius: 4px;
            margin-right: 10px;
        }

        /* 选项浮现动画 */
        .animate-in { animation: fadeUp 0.4s ease forwards; }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* 加载屏 */
        .loading-screen { text-align: center; }
        .spinner {
            width: 40px; height: 40px; border: 2px solid var(--glass-border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 1s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite; margin: 0 auto 30px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-family: 'Inter', monospace; color: var(--primary); font-size: 0.9rem; letter-spacing: 2px; }

        /* 结果屏 */
        .result-screen { padding-bottom: 60px; }
        .res-temp { font-family: 'Inter', sans-serif; font-size: 1.2rem; color: var(--text-muted); text-align: center; letter-spacing: 4px; margin-bottom: 10px; }
        .res-level { font-size: 2.8rem; color: #fff; text-align: center; margin-bottom: 15px; text-shadow: 0 0 40px var(--accent-glow); font-weight: 900; }
        .res-quote { text-align: center; color: var(--primary); font-style: italic; margin-bottom: 50px; font-size: 1.1rem; }
        .chart-container { max-width: 420px; margin: 0 auto 50px auto; position: relative; }
        
        .analysis-block { margin-bottom: 40px; background: rgba(0,0,0,0.2); padding: 30px; border-radius: 12px; border-left: 2px solid var(--primary); }
        .analysis-title { color: #fff; font-size: 1.1rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .typewriter-text { color: #aaa; line-height: 1.9; font-size: 0.95rem; min-height: 80px; }
        
        .cursor::after { content: ' █'; animation: blink 1s step-start infinite; color: var(--primary); font-size: 0.8em;}
        @keyframes blink { 50% { opacity: 0; } }

        @media (max-width: 600px) {
            .q-card { padding: 40px 20px; }
            .q-text { font-size: 1.15rem; }
            .title-main { font-size: 2.2rem; }
            .res-level { font-size: 2.2rem; }
            .opt-btn { padding: 16px 20px; }
            .opt-key { display: none; /* 移动端隐藏键盘提示 */ }
        }
    </style>
</head>
<body>

<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
<div class="progress-text" id="progressText"></div>

<div class="container">
    <div id="screen-welcome" class="screen active welcome-screen">
        <h1 class="title-main">单向深渊</h1>
        <p class="subtitle">这是一场极其私密的向内挖掘。<br>抛开一切道德与伪装，直视你内心最真实的残忍与狂热。<br>从绝对免疫到致命核爆，你对TA的爱，究竟处于哪个层级？<br><br><span style="font-size: 0.85rem; color: #555;">(支持键盘数字键 1-4 快捷答题)</span></p>
        <button class="btn" onclick="startTest()">剥离防线 · 开始测算</button>
    </div>

    <div id="screen-question" class="screen">
        <div class="q-card">
            <div class="q-header">
                <div class="q-num" id="questionNum">Q.01</div>
                <button class="back-btn" id="backBtn" onclick="goBack()">✦ 返回上一题</button>
            </div>
            <div class="q-text" id="questionText">加载中...</div>
            <div class="options" id="optionsContainer"></div>
        </div>
    </div>

    <div id="screen-loading" class="screen loading-screen">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">正在计算心理防线坍塌程度...</div>
    </div>

    <div id="screen-result" class="screen result-screen">
        <div class="res-temp" id="resTemp"></div>
        <div class="res-level" id="resTitle"></div>
        <div class="res-quote" id="resQuote"></div>
        
        <div class="chart-container"><canvas id="radarChart"></canvas></div>

        <div class="analysis-block">
            <div class="analysis-title">✦ 潜意识画像 (STATE)</div>
            <div class="typewriter-text" id="textDesc"></div>
        </div>
        <div class="analysis-block">
            <div class="analysis-title">✦ 毁灭与阴影 (SHADOW)</div>
            <div class="typewriter-text" id="textShadow"></div>
        </div>
        <div style="text-align: center; margin-top: 60px;">
            <button class="btn" style="font-size: 0.9rem; padding: 12px 35px;" onclick="location.reload()">重新观测</button>
        </div>
    </div>
</div>

<script>
    // 32道无重复深度题目
    const questions = [
        // --- 维度一：自我溶解 (Ego) ---
        { dim: "ego", q: "如果你心中一直有一个极其骄傲、绝不向任何人低头的底线，但在TA面前：", opts: [
            { text: "底线依然是底线，谁也不能让我妥协。", s: 1 },
            { text: "会偶尔软化，但事后会觉得有点委屈和不甘。", s: 2 },
            { text: "这根底线不知不觉中已经被TA推后了很远。", s: 3 },
            { text: "只要能留住TA，自尊心随时可以踩碎在脚下。", s: 4 }
        ]},
        { dim: "ego", q: "如果有一个绝佳的机会能让你实现人生最大的理想，代价是永远离开TA：", opts: [
            { text: "毫不犹豫选择理想，人生的主角只能是自己。", s: 1 },
            { text: "会极度痛苦地纠结，但最终大概率走向理想。", s: 2 },
            { text: "很有可能会放弃理想，选择留在TA身边。", s: 3 },
            { text: "毫无留恋地放弃理想。没有TA的世界，任何成就都形同废土。", s: 4 }
        ]},
        { dim: "ego", q: "当你的核心价值观与TA产生严重冲突时，你的第一反应是：", opts: [
            { text: "觉得不可理喻，立刻产生疏离感。", s: 1 },
            { text: "各自保留意见，避免讨论这个话题。", s: 2 },
            { text: "试图去理解TA，并在内心产生动摇。", s: 3 },
            { text: "直接抛弃自己过去的信仰，将TA的观念内化为新的真理。", s: 4 }
        ]},
        { dim: "ego", q: "为了满足TA的一个看似无理的物质或情感要求，你愿意付出的代价是：", opts: [
            { text: "直接拒绝，我只做合理的事。", s: 1 },
            { text: "在我完全游刃有余的范围内给予满足。", s: 2 },
            { text: "愿意稍微透支一点自己来让TA开心。", s: 3 },
            { text: "倾其所有，甚至背负巨大代价，只要TA想要。", s: 4 }
        ]},
        { dim: "ego", q: "如果在众人面前，TA无意中让你陷入了极其丢脸、自尊受挫的境地：", opts: [
            { text: "绝对无法忍受，当场发作或立刻冷战。", s: 1 },
            { text: "强忍着不发作，但心里已经给TA记了一笔重账。", s: 2 },
            { text: "觉得尴尬，但事后听TA解释就能释怀。", s: 3 },
            { text: "甚至觉得只要是TA给的难堪，我也能咽下去并为TA找借口。", s: 4 }
        ]},
        { dim: "ego", q: "你原本是一个极度需要个人空间的人，但现在面对TA的介入：", opts: [
            { text: "依然严格保持物理和心理的距离。", s: 1 },
            { text: "允许部分介入，但必须有我自己独处的红线。", s: 2 },
            { text: "经常主动让渡空间给TA，渐渐习惯陪伴。", s: 3 },
            { text: "巴不得TA能24小时占据我的空间，独处反而成了一种煎熬。", s: 4 }
        ]},
        { dim: "ego", q: "如果你发现自己为了迎合TA，变得连以前的朋友都不认识你了：", opts: [
            { text: "立刻警醒，迅速找回原本的自己。", s: 1 },
            { text: "感到一阵恐慌，试图找回平衡。", s: 2 },
            { text: "有一点迷茫，但觉得为了爱改变也值得。", s: 3 },
            { text: "一种病态的满足感——看，我连自己都杀死了，只为成为TA需要的人。", s: 4 }
        ]},
        { dim: "ego", q: "面对TA极其离谱的错误，只要TA向你示弱或请求原谅：", opts: [
            { text: "对错分明，绝不会因为示弱就翻篇。", s: 1 },
            { text: "需要很长时间的考察才可能原谅。", s: 2 },
            { text: "心容易软，很快就会妥协。", s: 3 },
            { text: "毫无抵抗力。哪怕TA刚开了一枪，只要TA说一句抱歉，我就敢把枪再递回去。", s: 4 }
        ]},

        // --- 维度二：意念穿透 (Obsess) ---
        { dim: "obsess", q: "当你处于极其忙碌、高压的工作或学习状态中时，关于TA的念头：", opts: [
            { text: "被完美屏蔽，我能绝对专注做自己的事。", s: 1 },
            { text: "只有在休息的间隙，大脑放空时才会想起。", s: 2 },
            { text: "会时不时闪现，成为我枯燥抗压时的慰藉。", s: 3 },
            { text: "像不可控的病毒，即使再忙，底层的神经依然被TA牵动，导致分心甚至焦虑。", s: 4 }
        ]},
        { dim: "obsess", q: "如果你看到TA在社交软件上给一个极其优秀的异性点赞、频繁互动：", opts: [
            { text: "完全无感，觉得只是正常的社交。", s: 1 },
            { text: "微微有点酸，但瞬间就自我消化了。", s: 2 },
            { text: "忍不住去视奸那个异性的主页，心里开始患得患失。", s: 3 },
            { text: "瞬间被剥夺氧气，产生极度的嫉妒、破坏欲甚至躯体上的心悸。", s: 4 }
        ]},
        { dim: "obsess", q: "发给TA一条信息后，如果超过两小时没有回复：", opts: [
            { text: "根本不会注意，我去忙别的了。", s: 1 },
            { text: "看一眼手机，心想TA应该在忙。", s: 2 },
            { text: "开始频繁切回聊天界面查看，情绪逐渐低落。", s: 3 },
            { text: "脑海中上演一万种灾难片，什么事都做不下去，陷入彻底的戒断反应。", s: 4 }
        ]},
        { dim: "obsess", q: "当你在外面独自遇到极其美丽的风景或吃到绝妙的美食时，你的第一感觉是：", opts: [
            { text: "单纯享受当下自己的时光。", s: 1 },
            { text: "拍个照发朋友圈记录下来。", s: 2 },
            { text: "第一时间想分享给TA看。", s: 3 },
            { text: "一种强烈的刺痛感——因为TA不在身边，这种美好本身变成了一种折磨。", s: 4 }
        ]},
        { dim: "obsess", q: "深夜醒来，四下无人的时候，TA的身影出现在你脑海里的频率：", opts: [
            { text: "几乎没有，我闭眼接着睡。", s: 1 },
            { text: "偶尔会梦到或想起，像掠过一阵风。", s: 2 },
            { text: "经常想起，伴随着思念的叹息。", s: 3 },
            { text: "每一次深夜惊醒，第一秒涌入脑海的绝对是TA，带着近乎窒息的空虚感。", s: 4 }
        ]},
        { dim: "obsess", q: "当你无意间在街上听到别人提起与TA相同的名字时：", opts: [
            { text: "内心毫无波澜，甚至都没注意到。", s: 1 },
            { text: "觉得有点巧合而已。", s: 2 },
            { text: "心里会“咯噔”一下，瞬间联想到TA。", s: 3 },
            { text: "如同被电击穿，周围的声音瞬间静音，感官被极度放大。", s: 4 }
        ]},
        { dim: "obsess", q: "假设你们要去不同的城市，分开长达一个月，你的临行前状态是：", opts: [
            { text: "觉得轻松，正好可以有自己的时间。", s: 1 },
            { text: "正常告别，觉得一个月很快就过去了。", s: 2 },
            { text: "十分不舍，提前安排好每天怎么联系。", s: 3 },
            { text: "一种仿佛要生离死别般的焦躁和饥渴感，恨不得把TA变小装进口袋带走。", s: 4 }
        ]},
        { dim: "obsess", q: "关于探究TA的过去（前任、童年、秘密），你的真实欲望是：", opts: [
            { text: "毫无兴趣，过去的事跟我无关。", s: 1 },
            { text: "TA愿意说我就听，不刻意问。", s: 2 },
            { text: "非常好奇，经常旁敲侧击地打听。", s: 3 },
            { text: "一种近乎病态的掌控欲，想把TA过去每一秒的生命经历都剖开据为己有。", s: 4 }
        ]},

        // --- 维度三：神性滤镜 (Halo) ---
        { dim: "halo", q: "在理智冷静的深夜，你如何客观评价TA的那些明显缺点？", opts: [
            { text: "看得很清楚，甚至经常因此觉得下头。", s: 1 },
            { text: "觉得那是可以忍受的小毛病，人无完人。", s: 2 },
            { text: "觉得那些缺点反而构成了TA真实可爱的一部分。", s: 3 },
            { text: "在我的滤镜下，TA的缺陷是某种迷人的特权，我甚至陶醉于TA对我的这种不完美。", s: 4 }
        ]},
        { dim: "halo", q: "当所有朋友都极其客观地向你指出，TA其实配不上你，或者是个渣人时：", opts: [
            { text: "会立刻把朋友的话听进去，开始清醒评估。", s: 1 },
            { text: "表面辩解，但心里其实已经种下了怀疑的种子。", s: 2 },
            { text: "觉得朋友根本不懂TA，极力反驳。", s: 3 },
            { text: "觉得人类的世俗标准根本无法衡量TA。就算与全世界为敌，我也只要TA。", s: 4 }
        ]},
        { dim: "halo", q: "如果有另一个在颜值、财富、情绪价值上都如同完美机器般超越TA的人疯狂追求你：", opts: [
            { text: "立刻被吸引，开始考虑换人。", s: 1 },
            { text: "内心疯狂动摇，在道德和欲望中挣扎。", s: 2 },
            { text: "也许会有一瞬虚荣，但最终还是坚定选择TA。", s: 3 },
            { text: "毫无波澜。因为我迷恋的是TA这个人带来的‘特定质感与痛感’，完美机器毫无意义。", s: 4 }
        ]},
        { dim: "halo", q: "如果用一个意象来形容TA在你生命宇宙里的位置：", opts: [
            { text: "一个同行过一段路的旅伴。", s: 1 },
            { text: "一个让我感到舒适的避风港。", s: 2 },
            { text: "黑夜里指引我前行的唯一灯塔。", s: 3 },
            { text: "宇宙中心的黑洞。失去TA，我整个世界的引力都会瞬间崩溃。", s: 4 }
        ]},
        { dim: "halo", q: "当你看到TA做着最平庸、最无聊的日常琐事（比如发呆、抠指甲）时：", opts: [
            { text: "觉得确实很无聊，没什么好看的。", s: 1 },
            { text: "觉得这就是普通人的样子。", s: 2 },
            { text: "觉得很温馨，有一种生活的烟火气。", s: 3 },
            { text: "像在欣赏一件神圣的艺术品，就算TA什么都不做，我也能看上几个小时。", s: 4 }
        ]},
        { dim: "halo", q: "对于TA在工作或生活中的失败和落魄，你眼中的TA是：", opts: [
            { text: "光环碎了一地，觉得TA不过如此。", s: 1 },
            { text: "客观承认TA能力不足，但表示同情。", s: 2 },
            { text: "心疼TA的遭遇，想帮TA重新站起来。", s: 3 },
            { text: "一种悲剧美感。就算TA沦为废人，在我眼里依然是落难的神明。", s: 4 }
        ]},
        { dim: "halo", q: "你觉得你究竟是爱TA真实的样子，还是爱上了你幻想出来的那个TA？", opts: [
            { text: "我只看重TA目前能提供给我的现实价值。", s: 1 },
            { text: "我爱的是TA身上符合我择偶标准的部分。", s: 2 },
            { text: "我爱TA真实的样子，好坏我都接受。", s: 3 },
            { text: "我已经分不清了。我亲手为TA镀上金身，然后自己跪下成为了最狂热的信徒。", s: 4 }
        ]},
        { dim: "halo", q: "TA随口说的一句极其普通的承诺或赞美，在你的系统里：", opts: [
            { text: "听听就过，不当真。", s: 1 },
            { text: "会开心一下，但过几天就忘了。", s: 2 },
            { text: "会珍藏在心里，时不时拿出来回味。", s: 3 },
            { text: "犹如刻在骨头上的圣旨，足以支撑我度过漫长且绝望的岁月。", s: 4 }
        ]},

        // --- 维度四：痛觉承载 (Pain) ---
        { dim: "pain", q: "如果TA因为某种原因（非背叛），需要你漫长地等待三年，且不给任何承诺：", opts: [
            { text: "直接拒绝，我的时间绝不耗在未知里。", s: 1 },
            { text: "试着等几个月，看不到希望就算了。", s: 2 },
            { text: "会努力等待，虽然过程会充满煎熬和动摇。", s: 3 },
            { text: "平静地接受。只要终点是TA，三年或者三十年，不过是数字而已。", s: 4 }
        ]},
        { dim: "pain", q: "当TA用极其冷漠或带刺的态度伤害了你，你躲在角落流泪时的心理活动是：", opts: [
            { text: "觉得这个人太差劲了，必须立刻止损离开。", s: 1 },
            { text: "感到极度委屈，等TA来道歉否则绝不理TA。", s: 2 },
            { text: "虽然很气，但还是反思是不是自己也有问题。", s: 3 },
            { text: "即便被刺得血肉模糊，只要TA此时招招手，我依然会像献祭般爬向TA。", s: 4 }
        ]},
        { dim: "pain", q: "如果可以有一种超能力，能把TA身上的重病或绝望痛苦完全转移到你身上：", opts: [
            { text: "绝对不干，各人有各人的命。", s: 1 },
            { text: "帮忙分担一点点可以，全部不行。", s: 2 },
            { text: "在TA濒危时，愿意替TA承受一半。", s: 3 },
            { text: "毫不犹豫地全部拿过来，看着TA安好，我遭受凌迟也觉得满足。", s: 4 }
        ]},
        { dim: "pain", q: "当你被TA极度误解，且TA根本不给你解释的机会时，你的痛苦来源于：", opts: [
            { text: "自尊心受挫，觉得TA太不讲理了。", s: 1 },
            { text: "觉得委屈，为什么TA不能相信我。", s: 2 },
            { text: "害怕这种误解会导致关系的破裂。", s: 3 },
            { text: "不在乎自尊被踩踏，只恐惧TA眼中对我流露出的哪怕一丝厌恶。", s: 4 }
        ]},
        { dim: "pain", q: "如果你明知道和TA继续走下去，前方是万丈深渊，注定粉身碎骨：", opts: [
            { text: "立刻踩刹车，我绝对不会拿自己的人生开玩笑。", s: 1 },
            { text: "走到悬崖边缘前最后一刻果断跳车。", s: 2 },
            { text: "充满恐惧，但还是闭着眼睛被TA拖着走了一段。", s: 3 },
            { text: "就算清醒地看着深渊，我也会牵着TA的手，以最惨烈的姿态跳下去。", s: 4 }
        ]},
        { dim: "pain", q: "当你们陷入长达数天的冷战，谁也不理谁时，你的状态：", opts: [
            { text: "无所谓，正好去跟朋友聚会打游戏。", s: 1 },
            { text: "觉得有点闷，但也能正常生活工作。", s: 2 },
            { text: "每天强颜欢笑，但内心像被掏空了一块。", s: 3 },
            { text: "犹如遭受钝刀子割肉，连呼吸都带着痛感，最终永远是我先崩溃投降。", s: 4 }
        ]},
        { dim: "pain", q: "如果有一天TA决绝地转身离开，留给你的后遗症会是：", opts: [
            { text: "睡个好觉，明天就能开启下一段寻找。", s: 1 },
            { text: "伤心几个月，然后重新回归正常轨道。", s: 2 },
            { text: "永远留下一道疤，以后爱别人都会有所保留。", s: 3 },
            { text: "彻底的精神死亡。我将变成一副空壳，此生再无力气对任何人燃起星火。", s: 4 }
        ]},
        { dim: "pain", q: "归根结底，你觉得在这段关系里，你为什么不愿意走？", opts: [
            { text: "因为目前TA给的条件还能满足我的需求。", s: 1 },
            { text: "因为习惯了，重新认识一个人太麻烦。", s: 2 },
            { text: "因为我舍不得那些曾经美好的回忆。", s: 3 },
            { text: "因为我知道，离开TA带来的痛，远比留在TA身边受折磨要恐怖一万倍。", s: 4 }
        ]}
    ];

    let currentQ = 0;
    let scores = { ego: 0, obsess: 0, halo: 0, pain: 0 };
    let answerHistory = []; // 存储历史答题记录，用于回退

    function switchScreen(hideId, showId) {
        document.getElementById(hideId).classList.remove('active');
        setTimeout(() => document.getElementById(showId).classList.add('active'), 400);
    }

    function startTest() {
        currentQ = 0;
        scores = { ego: 0, obsess: 0, halo: 0, pain: 0 };
        answerHistory = [];
        document.getElementById('progressText').style.color = "var(--primary)";
        switchScreen('screen-welcome', 'screen-question');
        renderQuestion();
        
        // 绑定键盘快捷键
        document.addEventListener('keydown', handleKeydown);
    }

    function handleKeydown(e) {
        if (document.getElementById('screen-question').classList.contains('active')) {
            const key = e.key;
            if (['1', '2', '3', '4'].includes(key)) {
                const q = questions[currentQ];
                if (q && q.opts[key - 1]) {
                    selectOpt(q.dim, q.opts[key - 1].s);
                }
            }
        }
    }

    function renderQuestion() {
        if (currentQ >= questions.length) {
            document.removeEventListener('keydown', handleKeydown);
            finishTest();
            return;
        }
        
        const progress = (currentQ / questions.length) * 100;
        document.getElementById('progressBar').style.width = `${progress}%`;
        document.getElementById('progressText').innerText = `${currentQ + 1} / ${questions.length}`;

        const q = questions[currentQ];
        const qContainer = document.getElementById('screen-question');
        
        // 控制返回按钮的显示与隐藏
        const backBtn = document.getElementById('backBtn');
        backBtn.style.display = currentQ > 0 ? 'block' : 'none';
        
        qContainer.style.opacity = 0;
        qContainer.style.transform = "translateY(15px)";
        
        setTimeout(() => {
            document.getElementById('questionNum').innerText = `Q.${(currentQ + 1).toString().padStart(2, '0')}`;
            document.getElementById('questionText').innerText = q.q;
            let optsHtml = '';
            q.opts.forEach((opt, idx) => {
                const delay = idx * 0.1; // 级联动画延迟
                optsHtml += `<div class="opt-btn animate-in" style="animation-delay: ${delay}s" onclick="selectOpt('${q.dim}', ${opt.s})">
                                <span class="opt-key">${idx + 1}</span>${opt.text}
                             </div>`;
            });
            document.getElementById('optionsContainer').innerHTML = optsHtml;
            
            qContainer.style.opacity = 1;
            qContainer.style.transform = "translateY(0)";
        }, 300);
    }

    function selectOpt(dim, score) {
        // 记录历史
        answerHistory.push({ dim: dim, score: score });
        scores[dim] += score;
        currentQ++;
        renderQuestion();
    }
    
    function goBack() {
        if (currentQ > 0) {
            const lastAnswer = answerHistory.pop(); // 弹出最后一次操作
            scores[lastAnswer.dim] -= lastAnswer.score; // 撤销分数
            currentQ--; // 题目回退
            renderQuestion(); // 重新渲染
        }
    }

    function finishTest() {
        document.getElementById('progressBar').style.width = '100%';
        document.getElementById('progressText').innerText = `COMPLETED`;
        switchScreen('screen-question', 'screen-loading');
        
        const loadTexts = [
            "正在读取潜意识深度...", 
            "正在测量自我溶解阈值...", 
            "正在解构痛觉承载力...", 
            "深渊镜像已锁定。"
        ];
        let c = 0;
        const txtInterval = setInterval(() => {
            c++;
            if(c < loadTexts.length) {
                document.getElementById('loadingText').innerText = loadTexts[c];
            }
        }, 800);

        setTimeout(() => {
            clearInterval(txtInterval);
            calculateLevel();
            switchScreen('screen-loading', 'screen-result');
        }, 3500);
    }

    function calculateLevel() {
        const totalScore = scores.ego + scores.obsess + scores.halo + scores.pain;
        let res = {};

        if (totalScore >= 116) {
            res = {
                temp: "10000℃", title: "【致命核爆 · 彻底献祭】",
                quote: "“每一个细胞都在叫嚣着你的名字，没有你，我只是一具行尸走肉。”",
                desc: "最高级别的狂热，理智已经灰飞烟灭。TA成为了你世界的绝对主宰和唯一信仰。为你生、为你死、为你与世界为敌。如果没有TA，你的精神宇宙会瞬间坍塌成黑洞。你交出了所有的底线，病态的占有欲、极端的痛觉承载力和厚到无法穿透的神性滤镜，共同构成了这场绚烂到极致的灾难。",
                shadow: "你把TA捧上了神坛，自己却低到了尘埃里。这种没有底线的狂热和彻底的自我毁灭，一旦遭遇背叛或对方哪怕一丝的冷落，带给你的都将是不可逆的精神粉碎。你正在玩一场只有一条命的俄罗斯轮盘赌。"
            };
        } else if (totalScore >= 96) {
            res = {
                temp: "100℃", title: "【刻骨深爱 · 灵魂交托】",
                quote: "“我已经做好了与你共担风雨的准备，并且甘之如饴。”",
                desc: "你已经彻底跨过了那条线，这就是毫无疑问的深爱。你接纳了TA的阴暗面与不完美，把TA写进了未来的每一个计划里。为了TA，你愿意退让重要的底线，愿意承受漫长的等待和刺骨的痛苦。你的自我边界已经开始消融，TA的悲伤会直接引发你的躯体疼痛。",
                shadow: "极高的痛觉承载力让你陷入了“自我感动式的牺牲”。你总是愿意先低头、先原谅。这种沉甸甸的爱，如果遇到一个不懂得珍惜的人，极易让关系滑向单向的索取与剥削。"
            };
        } else if (totalScore >= 76) {
            res = {
                temp: "70℃", title: "【沦陷边缘 · 疯狂拉扯】",
                quote: "“理智在向我发出红色警报，但目光依然不自觉地追随你。”",
                desc: "警告，你的理智防线正在被全面攻破。你发现自己开始不受控制地想起TA，情绪开始被TA的每一个标点符号牵动。占有欲和嫉妒心开始作祟，你在“清醒的自我保护”和“放纵的心动”之间疯狂拉扯。爱意正在以不可阻挡的势头向深渊蔓延。",
                shadow: "这是最折磨人的内耗期。你既做不到洒脱地转身，也做不到彻底的献祭。卡在“抽身”与“沉沦”之间的纠结，会极大地消耗你的生命力，让你变得患得患失、神经质。"
            };
        } else if (totalScore >= 51) {
            res = {
                temp: "37℃", title: "【好感微光 · 理智赏玩】",
                quote: "“你确实有些迷人，但这并不妨碍我随时转身离去。”",
                desc: "你对TA有一点好奇或欣赏，但这仅仅停留在表层的阶段。多巴胺微微分泌，但理智的闸门关得死死的。你愿意花时间陪伴，但在你心里，始终有一条清晰的红线——你爱TA，但你永远更爱自己。",
                shadow: "这种“进可攻、退可守”的状态固然安全无害，但在对方眼里，你永远留着一条随时撤离的后路。过分的清醒和算计，注定了你在这段关系中很难体会到真正触及灵魂的心动。"
            };
        } else {
            res = {
                temp: "0℃", title: "【绝对免疫 · 宛如路人】",
                quote: "“你只是途经我生命的一个名字，与旁边的树木无异。”",
                desc: "恭喜你，你的内心波澜不惊。TA对你而言，就是一个随时可以被替换的NPC。就算TA明天从你的世界里彻底消失，你的心跳也不会漏拍哪怕半秒。完全的物理与心理隔离，没有任何神性滤镜，你对TA展现出了极致的冷酷。",
                shadow: "其实根本谈不上什么危机，因为你根本不在乎。唯一需要警惕的是，如果你在这种状态下依然选择与对方维持着某种名义上的关系，那这对TA而言，无异于一场残忍的凌迟。"
            };
        }

        document.getElementById('resTemp').innerText = res.temp;
        if(totalScore >= 96) document.getElementById('resTemp').style.color = "var(--primary)";
        
        document.getElementById('resTitle').innerText = res.title;
        document.getElementById('resQuote').innerText = res.quote;
        
        drawRadar(scores);
        
        typeWriter(document.getElementById('textDesc'), res.desc, 0);
        setTimeout(() => typeWriter(document.getElementById('textShadow'), res.shadow, 0), res.desc.length * 35 + 600);
    }

    function typeWriter(element, text, index) {
        if (index === 0) { element.innerHTML = ''; element.classList.add('cursor'); }
        if (index < text.length) {
            element.innerHTML += text.charAt(index);
            setTimeout(() => typeWriter(element, text, index + 1), 30);
        } else {
            element.classList.remove('cursor');
        }
    }

    function drawRadar(scores) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        if (window.radarInstance) window.radarInstance.destroy();
        Chart.defaults.color = 'rgba(255, 255, 255, 0.5)';
        
        window.radarInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['自我溶解', '意念穿透', '神性滤镜', '痛觉承载'],
                datasets: [{
                    data: [scores.ego, scores.obsess, scores.halo, scores.pain],
                    backgroundColor: 'rgba(196, 60, 60, 0.25)',
                    borderColor: '#c43c3c', borderWidth: 2,
                    pointBackgroundColor: '#fff', pointRadius: 4, pointHoverRadius: 6
                }]
            },
            options: {
                scales: {
                    r: {
                        min: 8, max: 32,
                        ticks: { display: false, stepSize: 6 },
                        grid: { color: 'rgba(255,255,255,0.06)' },
                        angleLines: { color: 'rgba(196, 60, 60, 0.3)' },
                        pointLabels: { font: { size: 13, family: "'Noto Serif SC', serif", weight: '600' }, color: '#d1d1d1' }
                    }
                },
                plugins: { legend: { display: false } },
                maintainAspectRatio: false
            }
        });
    }
</script>
